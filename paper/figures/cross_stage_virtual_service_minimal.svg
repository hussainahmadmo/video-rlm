<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0877b7"/>
    </marker>
    <style>
      .panel { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #172026; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #172026; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #263238; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #455a64; }
      .box { fill: #fff; stroke: #455a64; stroke-width: 2.2; rx: 9; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2.5; marker-end: url(#arrow); }
      .update { fill: none; stroke: #0877b7; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#blueArrow); }
    </style>
  </defs>

  <rect width="1800" height="650" fill="#fff"/>

  <!-- Baseline -->
  <rect x="35" y="35" width="570" height="575" fill="#fbfcfd" stroke="#90a4ae" stroke-width="2" rx="14"/>
  <text x="320" y="82" text-anchor="middle" class="panel">(a) vLLM with VTC</text>

  <rect x="85" y="135" width="190" height="100" class="box"/>
  <text x="180" y="174" text-anchor="middle" class="body" font-weight="700">Raw-video requests</text>
  <rect x="115" y="194" width="48" height="22" fill="#1687bd" rx="3"/>
  <rect x="174" y="194" width="70" height="22" fill="#ed8628" rx="3"/>

  <path d="M275 185 L338 185" class="arrow"/>
  <rect x="343" y="125" width="210" height="120" fill="#fff5f3" stroke="#c43d2f" stroke-width="2.2" rx="9"/>
  <text x="448" y="164" text-anchor="middle" class="head">Native video loading</text>
  <text x="448" y="196" text-anchor="middle" class="body">fetch · decode · resize</text>
  <text x="448" y="225" text-anchor="middle" class="small" fill="#a33228">not charged by VTC</text>

  <path d="M448 245 L448 324" class="arrow"/>
  <rect x="318" y="330" width="260" height="105" class="box"/>
  <text x="448" y="369" text-anchor="middle" class="head">VTC token counters</text>
  <text x="448" y="402" text-anchor="middle" class="body">select least-served client</text>

  <path d="M318 382 L258 382" class="arrow"/>
  <rect x="82" y="330" width="170" height="105" class="box"/>
  <text x="167" y="371" text-anchor="middle" class="head">vLLM engine</text>
  <text x="167" y="402" text-anchor="middle" class="small">GPU execution</text>
  <path d="M167 435 C167 515 448 515 448 435" class="update"/>
  <text x="307" y="505" text-anchor="middle" class="small" fill="#0877b7">charge served tokens</text>

  <!-- Ours -->
  <rect x="635" y="35" width="1130" height="575" fill="#fbfcfd" stroke="#90a4ae" stroke-width="2" rx="14"/>
  <text x="1200" y="82" text-anchor="middle" class="panel">(b) Our CPU--GPU scheduler</text>

  <rect x="680" y="137" width="205" height="120" class="box"/>
  <text x="782" y="173" text-anchor="middle" class="head">Workload queues</text>
  <text x="702" y="207" class="body">VideoQA</text>
  <rect x="794" y="190" width="31" height="22" fill="#1687bd" rx="3"/>
  <rect x="833" y="190" width="31" height="22" fill="#9cd5eb" rx="3"/>
  <text x="702" y="239" class="body">Evaluation</text>
  <rect x="794" y="222" width="31" height="22" fill="#ed8628" rx="3"/>
  <rect x="833" y="222" width="31" height="22" fill="#f6bd84" rx="3"/>

  <path d="M885 197 L945 197" class="arrow"/>
  <rect x="950" y="125" width="260" height="145" class="box"/>
  <text x="1080" y="160" text-anchor="middle" class="head">Preparation counters</text>
  <text x="970" y="199" class="small">VQA / w<tspan baseline-shift="sub" font-size="11">VQA</tspan></text>
  <rect x="1080" y="181" width="105" height="23" fill="#1687bd" rx="3"/>
  <text x="970" y="237" class="small">Eval / w<tspan baseline-shift="sub" font-size="11">Eval</tspan></text>
  <rect x="1080" y="219" width="70" height="23" fill="#ed8628" rx="3"/>
  <text x="1080" y="260" text-anchor="middle" class="small">tenant share, then service class</text>

  <path d="M1210 197 L1270 197" class="arrow"/>
  <rect x="1275" y="125" width="225" height="145" class="box"/>
  <text x="1387" y="160" text-anchor="middle" class="head">Decode workers</text>
  <text x="1387" y="188" text-anchor="middle" class="small">bounded, non-preemptive</text>
  <rect x="1307" y="211" width="38" height="36" fill="#e4ebef" stroke="#607d8b" rx="4"/>
  <rect x="1354" y="211" width="38" height="36" fill="#e4ebef" stroke="#607d8b" rx="4"/>
  <rect x="1401" y="211" width="38" height="36" fill="#e4ebef" stroke="#607d8b" rx="4"/>
  <rect x="1448" y="211" width="38" height="36" fill="#e4ebef" stroke="#607d8b" rx="4"/>
  <path d="M1387 125 C1387 103 1125 103 1125 125" class="update"/>
  <text x="1255" y="111" text-anchor="middle" class="small" fill="#0877b7">charge preparation time</text>

  <path d="M1500 197 L1555 197" class="arrow"/>
  <rect x="1560" y="145" width="160" height="105" class="box"/>
  <text x="1640" y="183" text-anchor="middle" class="head">Bounded</text>
  <text x="1640" y="211" text-anchor="middle" class="head">handoff</text>

  <path d="M1640 250 L1640 350" class="arrow"/>
  <rect x="1445" y="355" width="275" height="140" class="box"/>
  <text x="1582" y="390" text-anchor="middle" class="head">Inference counters</text>
  <text x="1465" y="430" class="small">VQA / w<tspan baseline-shift="sub" font-size="11">VQA</tspan></text>
  <rect x="1582" y="412" width="105" height="23" fill="#1687bd" rx="3"/>
  <text x="1465" y="468" class="small">Eval / w<tspan baseline-shift="sub" font-size="11">Eval</tspan></text>
  <rect x="1582" y="450" width="102" height="23" fill="#ed8628" rx="3"/>

  <path d="M1445 425 L1378 425" class="arrow"/>
  <rect x="1170" y="370" width="202" height="110" class="box"/>
  <text x="1271" y="412" text-anchor="middle" class="head">vLLM engine</text>
  <text x="1271" y="443" text-anchor="middle" class="small">native priority</text>
  <path d="M1271 480 C1271 548 1582 548 1582 495" class="update"/>
  <text x="1427" y="540" text-anchor="middle" class="small" fill="#0877b7">charge inference service</text>

  <rect x="680" y="370" width="395" height="110" fill="#eef8ed" stroke="#4d8b45" stroke-width="2" rx="9"/>
  <text x="877" y="412" text-anchor="middle" class="head">Selection rule</text>
  <text x="877" y="445" text-anchor="middle" class="body">least-served tenant → foreground first</text>
</svg>
